  feedstock-name: python
  recipe-maintainers:
    - isuruf
    - jakirkham
    - mbargull
    - mingwandroid
    - msarahan
    - pelson
    - ocefpaf
    - scopatz
    - katietz
    - xhochy
  only-lint:
    - missing_home
