{% set version = "3.15.0" %}
{% set dev = "b4" %}
{% set dev_ = "" %}
{% set ver2 = '.'.join(version.split('.')[0:2]) %}
{% set ver2nd = ''.join(version.split('.')[0:2]) %}
{% set ver3nd = ''.join(version.split('.')[0:3]) %}
{% set build_number = 0 %}
{% set channel_targets = ('abc', 'def')  %}
# this is just for the initial build, to break dependencies with python -> pip -> libpython-static
{% set bootstrap = "false" %}

# this makes the linter happy
{% set channel_targets = channel_targets or 'conda-forge main' %}

# Sanitize build system env. var tweak parameters
# (passed to the build scripts via script_env).
{% set abi_tag = "cp" + ver2nd + ("t" if freethreading == "yes" else "") %}
{% set build_number = build_number + (0 if freethreading == "yes" else 100) %}
{% set py_interp_debug = "yes" if build_type == "debug" else "no" %}
{% set debug = "_debug" if build_type == "debug" else "" %}
{% set py_gil_disabled = "yes" if freethreading == "yes" else "no" %}
# Divergence from conda-forge: CF dropped the interpreter-linkage knob entirely
# and drives freethreading via PY_FREETHREADING. Anaconda's build scripts still
# key off PY_INTERP_LINKAGE_NATURE (build_base.sh/build_static.sh) and PY_GIL_DISABLED,
# so we keep them. We no longer read them from os.environ (that broke the linter);
# Anaconda only ships a statically-linkable interpreter, so these are constants:
#   - linkage_nature: build-string suffix; empty because "static" is the only value.
#   - linkage_nature_env: value exported as PY_INTERP_LINKAGE_NATURE for the scripts.
{% set linkage_nature = "" %}
{% set linkage_nature_env = 'static' %}
{% set site_packages_path_unix = ("lib/python" + ver2 + "t/site-packages" if freethreading == "yes" else "lib/python" + ver2 + "/site-packages") %}
{% set site_packages_path = "Lib/site-packages" if win else site_packages_path_unix %}

package:
  name: python-split
  version: {{ version }}{{ dev }}

source:
  - url: https://www.python.org/ftp/python/{{ version }}/Python-{{ version }}{{ dev }}.tar.xz
    # md5 from: https://www.python.org/downloads/release/python-{{ ver3nd }}/
    sha256: 93efb9c88d7b6633368e7f7b8f8db6e98988f7f761c09b77849447262841ce3a
    patches:
      - patches/0001-Win32-Change-FD_SETSIZE-from-512-to-2048.patch
      - patches/0002-Win32-Do-not-download-externals.patch
      - patches/0003-Fix-find_library-so-that-it-looks-in-sys.prefix-lib-.patch
      # https://github.com/python/cpython/pull/28397
      # Patch doesn't apply, but is Debian-specific anyway.
      # - patches/0008-bpo-22699-Allow-compiling-on-debian-ubuntu-with-a-di.patch
      - patches/0004-Disable-registry-lookup-unless-CONDA_PY_ALLOW_REG_PA.patch
      - patches/0005-Unvendor-openssl.patch
      - patches/0006-Unvendor-sqlite3.patch
      - patches/0007-Add-CondaEcosystemModifyDllSearchPath.patch
      - patches/0008-Doing-d1trimfile.patch
      # https://github.com/python/cpython/pull/23523
      - patches/0009-Allow-cross-compiling-for-Darwin.patch
      - patches/0010-Fix-TZPATH-on-windows.patch
      # https://github.com/python/cpython/pull/24324
      - patches/0011-Make-dyld-search-work-with-SYSTEM_VERSION_COMPAT-1.patch
      - patches/0012-Unvendor-bzip2.patch
      - patches/0013-Unvendor-libffi.patch
      - patches/0014-Unvendor-tcltk.patch
      - patches/0015-unvendor-xz.patch
      - patches/0016-unvendor-zlib.patch
      - patches/0017-Do-not-pass-g-to-GCC-when-not-Py_DEBUG.patch
      - patches/0018-Unvendor-expat.patch
      - patches/0019-Remove-unused-readelf.patch
      - patches/0021-Override-configure-LIBFFI.patch
      - patches/0022-Unvendor-libmpdec.patch
      - patches/0023-branding.patch
      - patches/0024-Unvendor-zlib-ng.patch
      - patches/0025-Unvendor-zstd.patch
      - patches/0026-xxlimited-freethreading-stable-abi-link.patch  # [win and freethreading == "yes"]

build:
  number: {{ build_number }}

requirements:
  build:
    - msys2-gcc-libs        # [win]

outputs:
  - name: python
    script: build_base.sh   # [unix]
    script: build_base.bat  # [win]
    build:
      number: {{ build_number }}
      activate_in_script: true
      # Windows has issues updating python if conda is using files itself.
      # Copy rather than link.
      no_link:
        - DLLs/_ctypes.pyd       # [win]
      ignore_run_exports_from:   # [unix]
        # C++ only installed so CXX is defined for distutils/sysconfig.
        - {{ compiler('cxx') }}  # [unix]
        # These two are just to get the headers needed for tk.h, but is unused
        - xorg-libx11            # [linux]
        - xorg-xorgproto         # [linux]
      # Disabled until verified to work correctly
      detect_binary_files_with_prefix: true
      # detect_binary_files_with_prefix: False
      # binary_has_prefix_files:
      #   - lib/libpython{{ ver2 }}.*.1.0
      #   - bin/python{{ ver2 }}  # [linux]
      #   - lib/libpython{{ ver2 }}.a  # [linux]
      #   - lib/libpython{{ ver2 }}.nolto.a  # [linux]
      #   - lib/libpython3.so  # [linux]
      #   - lib/python{{ ver2 }}/lib-dynload/_hashlib.cpython-{{ ver2nd }}-x86_64-linux-gnu.so  # [linux]
      #   - lib/libpython3.dylib  # [osx]
      # match python.org compiler standard (vc14+ only for 3.15)
      skip: true  # [win and vc < 14]
      string: {{ dev_ }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}{{ linkage_nature }}{{ debug }}_{{ abi_tag }}
      python_site_packages_path: {{ site_packages_path }}
      track_features:     # [freethreading == "yes"]
        - free-threading  # [freethreading == "yes"]
      run_exports:
        noarch:
          - python
        weak:
          - python_abi {{ ver2 }}.* *_{{ abi_tag }}
          - python {{ ver2 }}.* *_debug_{{ abi_tag }}  # [build_type == "debug"]
      script_env:
        - PY_INTERP_LINKAGE_NATURE={{ linkage_nature_env }}
        - PY_INTERP_DEBUG={{ py_interp_debug }}
        - PY_GIL_DISABLED={{ py_gil_disabled }}
        - CONDA_FORGE=no
      missing_dso_whitelist:   # [win or linux]
        - '**/MSVCR71.dll'  # [win]
        - '**/MSVCR80.dll'  # [win]
        # I have no idea why this is not in C:\Windows\System32\downlevel
        - '**/api-ms-win-core-path-l1-1-0.dll'  # [win]
        # -=- libs that come from the sysroot.
        - '$RPATH/libc.so.6'        # [linux]
        - '$RPATH/libcrypt.so.1'    # [linux]
        - '$RPATH/libdl.so.2'       # [linux]
        - '$RPATH/libm.so.6'        # [linux]
        - '$RPATH/libnsl.so.1'      # [linux]
        - '$RPATH/libpthread.so.0'  # [linux]
        - '$RPATH/librt.so.1'       # [linux]
        - '$RPATH/libutil.so.1'     # [linux]

    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - sed                           # [unix]
        - make                          # [not win]
        - libtool                       # [unix]
        - pkg-config                    # [not win]
        # configure script looks for llvm-ar for lto
        - llvm-tools                    # [osx]
        - ld_impl_{{ target_platform }} # [linux]
        # called in build_base.sh
        - ripgrep                       # [not win]
        - binutils_impl_{{ target_platform }}  # [linux]
        # https://github.com/python/cpython/blob/main/Tools/jit/README.md#installing-llvm:
        # "LLVM version 21 is the officially supported version"
        - clang-21         # [not win]
        - llvm-tools-21    # [not win]
        - clang 21.*       # [win]
        - llvm-tools 21.*  # [win]
      host:
        - bzip2 {{ bzip2 }}
        - sqlite {{ sqlite }}
        - xz {{ xz }}
        # Although we might like to use zlib-ng something else is
        # pulling in zlib and we get an overlinking error
        - zlib {{ zlib }}
        #- zlib-ng {{ zlib_ng }}
        - openssl {{ openssl }}
        - readline {{ readline }}                # [not win]
        - tk {{ tk }}
        # These two are just to get the headers needed for tk.h, but is unused
        - xorg-libx11 {{ xorg_libx11 }}          # [linux]
        - xorg-xorgproto {{ xorg_xorgproto }}    # [linux]
        - ncurses {{ ncurses }}                  # [unix]
        - libffi {{ libffi }}
        - ld_impl_{{ target_platform }} >=2.35.1 # [linux]
        - libuuid {{ libuuid }}                  # [linux]
        - libmpdec-devel {{ libmpdec }}
        - expat {{ expat }}
        - zstd {{ zstd }}
      run:
        - python_abi * *_{{ abi_tag }}
        - ld_impl_{{ target_platform }} >=2.35.1  # [linux]
        - tzdata
    test:
      requires:
        - ripgrep
        - cmake-no-system
        - make  # [unix]
        - ninja-base
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        # Tried to use enable_language(C) to avoid needing this. It does not work.
        - {{ compiler('cxx') }}
      files:
        - tests/cmake/*
        - tests/cython/*
        - tests/prefix-replacement/*
        - run_test.py
      commands:
        - echo on  # [win]
        - set  # [win]
        - python -V
        - python3 -V            # [not win]
        - pydoc -h
        - python3-config --help  # [not win]
        - set "PIP_NO_BUILD_ISOLATION=False"  # [win]
        - set "PIP_NO_DEPENDENCIES=True"  # [win]
        - set "PIP_IGNORE_INSTALLED=True"  # [win]
        - set "PIP_NO_INDEX=True"  # [win]
        - set "PIP_CACHE_DIR=%CONDA_PREFIX%/pip_cache"  # [win]
        - set "TEMP=%CONDA_PREFIX%/tmp"  # [win]
        - mkdir "%TEMP%"  # [win]
        - python -Im ensurepip --upgrade --default-pip  # [win]
        # tzdata/zoneinfo test that will need the tzdata package to pass
        - python -c "from zoneinfo import ZoneInfo; from datetime import datetime; dt = datetime(2020, 10, 31, 12, tzinfo=ZoneInfo('America/Los_Angeles')); print(dt.tzname())"
        - python -m venv test-venv
        - test-venv\\Scripts\\python.exe -c "import ctypes"  # [win]
        - test-venv/bin/python -c "import ctypes"            # [unix]
        - python -c "import sysconfig; print(sysconfig.get_config_var('CC'))"  # [not win]
        - _CONDA_PYTHON_SYSCONFIGDATA_NAME=_sysconfigdata_x86_64_conda_cos6_linux_gnu python -c "import sysconfig; print(sysconfig.get_config_var('CC'))"   # [linux64]
        # check for unreplaced @ symbols in sysconfig files
        - for f in ${CONDA_PREFIX}/lib/python*/_sysconfig*.py; do echo "Checking $f:"; if [[ `rg @[^@]*@ $f` ]]; then echo "FAILED ON $f"; cat $f; exit 1; fi; done  # [linux64 or osx]
        - test ! -f ${PREFIX}/lib/libpython${PKG_VERSION%.*}.a  # [unix]
        - test ! -f ${PREFIX}/lib/libpython${PKG_VERSION%.*}.nolto.a  # [unix]
        # https://github.com/conda-forge/python-feedstock/issues/384
        - if exist %PREFIX%\\Scripts\\pydoc exit 1  # [win]
        - if exist %PREFIX%\\Scripts\\idle exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\pydoc-script.py exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\idle-script.py exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\idle.exe exit 1  # [win]
        - if not exist %PREFIX%\\Scripts\\pydoc.exe exit 1  # [win]
        - if not exist %PREFIX%\include\pyconfig.h exit 1  # [win]
        - if not exist %PREFIX%\libs\python3t.lib exit 1                # [win and freethreading == "yes"]
        - if not exist %PREFIX%\libs\python{{ ver2nd }}t.lib exit 1     # [win and freethreading == "yes"]
        - if not exist %PREFIX%\libs\python3.lib exit 1                 # [win and freethreading == "no"]
        - if not exist %PREFIX%\libs\python{{ ver2nd }}.lib exit 1      # [win and freethreading == "no"]
        - pushd tests
        - pushd prefix-replacement    # [unix]
        - bash build-and-test.sh      # [unix]
        - popd    # [unix]
        - pushd cmake
        # FindPythonLibs does not know freethreading ABI; skip like conda-forge main.
        - cmake -GNinja -DPY_VER={{ version }} --debug-find --trace --debug-output --debug-trycompile .  # [unix and freethreading == "no"]
        - cmake -GNinja -DPY_VER={{ version }} --debug-find --trace --debug-output --debug-trycompile .  # [win and freethreading == "no"]
        - popd
        - popd
        - python run_test.py
        - rm -f default.profraw  # [osx]
        - test ! -f default.profraw   # [osx]
        # Test workaround for https://github.com/conda/conda/issues/10969
        - python3.1 --version  # [unix]
        # Test for segfault on osx-64 with libffi=3.4, see https://bugs.python.org/issue44556
        - python -c "from ctypes import CFUNCTYPE; CFUNCTYPE(None)(id)"

  - name: libpython-static
    script: build_static.sh  # [unix]
    script: build_static.bat  # [win]
    build:
      number: {{ build_number }}
      force_use_keys:
        - freethreading
        - build_type
      activate_in_script: true
      ignore_run_exports:
        - python_abi
      string: h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}{{ linkage_nature }}{{ debug }}_{{ abi_tag }}
      script_env:
        - PY_INTERP_DEBUG={{ py_interp_debug }}
        - PY_GIL_DISABLED={{ py_gil_disabled }}
    requirements:
      build:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
      host:
        - {{ pin_subpackage('python', exact=True) }}
      run:
        - {{ pin_subpackage('python', exact=True) }}
    test:
      files:
        - tests/prefix-replacement/*
      requires:
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        # Tried to use enable_language(C) to avoid needing this. It does not work.
        - {{ compiler('cxx') }}
        - ripgrep

      commands:
        - VER=${PKG_VERSION%.*}    # [not win]
        - VERABI=${VER}            # [not win]
        - VERABI=${VERABI}t        # [not win and freethreading == "yes"]
        - VERABI_NO_DBG=${VERABI}  # [not win]
        - VERABI=${VERABI}d        # [not win and build_type == "debug"]
        - test -f ${PREFIX}/lib/libpython${VERABI}.a  # [unix]
        - test -f ${PREFIX}/lib/libpython${VERABI_NO_DBG}.nolto.a  # [unix]
        - test -f ${PREFIX}/lib/python${VERABI_NO_DBG}/config-${VERABI}-darwin/libpython${VERABI}.a  # [osx]
        - pushd tests/prefix-replacement    # [unix]
        - bash build-and-test.sh      # [unix]
        - popd    # [unix]

  - name: python-freethreading
    build:
      noarch: generic
      skip: true  # [freethreading == "no"]
    requirements:
      - python {{ version }}{{ dev }}.*
      - python_abi * *_{{ abi_tag }}

  - name: python-gil
    build:
      noarch: generic
      skip: true  # [freethreading == "yes"]
    requirements:
      - python {{ version }}{{ dev }}.*
      - python_abi * *_{{ abi_tag }}

  - name: python-jit
    script: install_jit_activation.sh   # [not win]
    script: install_jit_activation.bat  # [win]
    build:
      skip: true  # [freethreading == "yes"]
      skip: true  # [build_type == "debug"]
      noarch: generic
    requirements:
      - python {{ version }}{{ dev }}
      - __unix   # [unix]
      - __win    # [win]
    test:
      files:
        - run_test_jit.py
      commands:
        - python run_test_jit.py

about:
  home: https://www.python.org/
  license: PSF-2.0
  license_family: PSF
  license_url: https://docs.python.org/3/license.html
  license_file: LICENSE
  summary: General purpose programming language
  description: |
    Python is a widely used high-level, general-purpose, interpreted, dynamic
    programming language. Its design philosophy emphasizes code
    readability, and its syntax allows programmers to express concepts in
    fewer lines of code than would be possible in languages such as C++ or
    Java. The language provides constructs intended to enable clear programs
    on both a small and large scale.
  doc_url: https://www.python.org/doc/versions/
  dev_url: https://devguide.python.org/

