# the conda-build parameters to use for disabling --skip-existing
build_parameters:
  - "--suppress-variables"
  #- "--skip-existing"
  - "--error-overlinking"
  - "--error-overdepending"

# Upload testing artifacts: ad-testing/label/py315
upload_channels:
  - ad-testing/label/py315

# Resolve pre-release stack from testing (singular label/; never labels/)
channels:
  - ad-testing/label/py315

build_env_vars:
  ANACONDA_ROCKET_ENABLE_PY315: yes
